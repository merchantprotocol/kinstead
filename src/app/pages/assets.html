<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinstead · Asset library</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body { margin: 0; background: #eef1f4; font: 14px/1.4 Georgia, serif; color: #2a2a2a; }
  header { padding: 14px 18px 4px; font-size: 22px; display: flex; align-items: baseline; gap: 12px; }
  header small { font-size: 13px; color: #666; }
  h3 { margin: 18px 18px 6px; font-size: 16px; color: #7a1f24; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 0 18px 12px; }
  .card { background: #fff; border: 1px solid #d3d9e0; border-radius: 10px; overflow: hidden; cursor: pointer; }
  .card:hover { border-color: #7a1f24; }
  .card img { display: block; width: 100%; aspect-ratio: 4 / 3; background: #e3e8ee; }
  .card div { padding: 6px 10px; } .card b { display: block; } .card span { color: #666; font-size: 12px; }
  #viewer { position: fixed; inset: 0; background: rgba(20, 24, 30, .72); display: none; align-items: center; justify-content: center; }
  #viewer.on { display: flex; }
  #viewer .box { background: #fff; border-radius: 12px; padding: 12px; max-width: 96vw; }
  #view { display: block; border-radius: 8px; cursor: grab; max-width: 92vw; }
  #viewer p { margin: 8px 4px 0; } #viewer button { float: right; }
</style>
</head>
<body>
<header>Asset library <small>every building, wall and gate, with the person who works there. Click one to turn it.</small></header>
<div id="sheet"></div>
<div id="viewer"><div class="box"><button id="close">Close</button><canvas id="view" width="900" height="620"></canvas><p id="desc"></p></div></div>
<script src="{{asset:three.min.js}}"></script>
<script src="{{asset:engine.js}}"></script>
<script>
(function () {
  const THREE = window.THREE, K = window.K, T = K.TILE || 0.5;
  /* [id, name, kind, worker sprite, worker tint, worker name] ; kind: piece | run (a row of wall) | building (a walk-in prefab) */
  const GROUPS = [
    ['Walls and gates', [['palisade', 'Palisade', 'run'], ['stone_wall', 'Stone wall', 'run'], ['gate', 'Wooden gate', 'piece'], ['stone_gate', 'Stone gate with drawbridge', 'piece'], ['watchtower', 'Watchtower', 'piece', 'ranger', 0xc8e0ff, 'Archer'], ['fire_pot', 'Fire pot', 'piece']]],
    ['Homes and trade', [['cottage', 'Cottage', 'building', 'witch', 0xffd8b0, 'Cook'], ['market_hall', 'Marketplace', 'building', 'ranger', 0xc8e0ff, 'Clerk'], ['smithy', 'Blacksmith', 'building', 'warden', 0x9a8a7a, 'Smith'], ['stable', 'Stable', 'building', 'ranger', 0xd8c090, 'Stablehand'], ['bakery', 'Bakery', 'building', 'witch', 0xfff0d8, 'Baker'], ['butcher', 'Butcher', 'building', 'warden', 0xf0c0b0, 'Butcher'], ['library', 'Alchemist library', 'building', 'witch', 0xd8c0ff, 'Alchemist'], ['storehouse', 'Storehouse', 'piece', 'warden', 0xb0c8a0, 'Storekeeper']]],
    ['Producers', [['woodcutter', 'Woodcutter', 'piece', 'ranger', 0x9ac080, 'Woodcutter'], ['quarry', 'Quarry', 'piece', 'warden', 0xc0b8a8, 'Quarryman']]],
    ['Farming', [['farm', 'Farm', 'piece', 'ranger', 0xe8d090, 'Farmer'], ['field', 'Wheat field (one square)', 'piece'], ['silo', 'Grain silo', 'piece'], ['coop', 'Chicken coop', 'piece', 'witch', 0xf0e0c0, 'Henwife'], ['barn', 'Cattle barn', 'piece', 'warden', 0xd0b080, 'Cowherd']]],
  ];
  const extra = (K.ASSET_EXTRA || []); if (extra.length) GROUPS.push(['New', extra]);
  const prefabOk = (id) => !!(K.BUILDING_PREFABS && K.BUILDING_PREFABS[id]);
  /* every walk-in building also gets an "inside" card: the roof and upper walls cut away, as in the game */
  for (const g of GROUPS) { const out = []; for (const it of g[1]) { out.push(it); if (it[2] === 'building') out.push([it[0], it[1] + ' · inside', 'inside', it[3], it[4], it[5]]); } g[1] = out; }

  const R = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); R.shadowMap.enabled = true; R.outputColorSpace = THREE.SRGBColorSpace;
  const mats = new K.BuildingMaterials(new K.TextureBank(R)), art = new K.CastleArt(mats);
  function scene() {
    const S = new THREE.Scene(); S.background = new THREE.Color('#e6ebf0');
    S.add(new THREE.HemisphereLight('#dfe8f8', '#6a6258', 1.7));
    const sun = new THREE.DirectionalLight('#fff0dc', 2.7); sun.position.set(-8, 14, 10); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0005;
    Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10, far: 60 }); S.add(sun);
    const rim = new THREE.DirectionalLight('#b8c8f0', 0.8); rim.position.set(8, 6, -8); S.add(rim);
    const g = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshLambertMaterial({ color: '#f4f6f8' })); g.rotation.x = -Math.PI / 2; g.receiveShadow = true; S.add(g);
    return { S, sun };
  }
  function model(it) {
    const [id, , kind] = it, grp = new THREE.Group();
    if (kind === 'building' || kind === 'inside') {
      if (!prefabOk(id)) return null;
      const spec = K.BuildingSpec.normalize(K.makeBuilding(id, 0, 0, id, 31)), bm = new K.BuildingMesh(spec, { mats, catalog: K.FURNITURE }); grp.add(bm.group);
      if (kind === 'inside') { for (const [n, l] of Object.entries(bm.layers)) if (n !== 'base') l.snap(0); grp.userData.inside = true; grp.userData.bm = bm; }
      else if (id === 'market_hall') { const st = art.piece('market', { level: 1 }); st.position.set(spec.footprint.w * T / 2, 0, spec.footprint.h * T + 1.0); grp.add(st); }
      grp.userData.front = { x: spec.footprint.w * T / 2, z: spec.footprint.h * T + 2.2 };
    } else if (kind === 'run') {
      for (let i = 0; i < 6; i++) { const m = art.piece(id, { level: 1 }); m.position.set(i * 0.5, 0, 0); grp.add(m); }
      grp.userData.front = { x: 1.25, z: 1.4 };
    } else { grp.add(art.piece(id, { level: 1 })); const [w, d] = K.CastleArt.size(id); grp.userData.front = { x: w / 2 + 0.6, z: d / 2 + 0.6 }; }
    grp.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
    return grp;
  }
  /** the person who works there, standing out front */
  function worker(it, S, sun, grp) {
    const [, , , sprite0, tint0, who] = it, look = (K.WORKER_LOOKS || {})[who], sprite = look ? look.sprite : sprite0, tint = look ? look.tint : tint0; if (!sprite || !K.ActorViews) return;
    try {
      const View = K.ActorViews.classFor(sprite), v = new View({ scene: S, sun, camera: null }, sprite, { scale: 1, phase: 0.3 });
      const f = grp.userData.front; if (v.rig) { v.rig.group.position.set(f.x, 0, f.z); v.rig.group.rotation.y = 0.5; if (tint != null) v.setTint(tint); if (v.anim && v.anim.update) v.anim.update(0.016); }
      if (v.blob) v.blob.position.set(f.x, 0.01, f.z);
    } catch (e) { console.warn('worker view', e); }
  }
  function frame(grp, cam, yaw = 0.75, pitch = 0.55, zoom = 1.75) {
    const box = new THREE.Box3().setFromObject(grp), c = box.getCenter(new THREE.Vector3()), size = box.getSize(new THREE.Vector3()).length();
    const d = size * zoom; cam.position.set(c.x + Math.sin(yaw) * Math.cos(pitch) * d, c.y + Math.sin(pitch) * d, c.z + Math.cos(yaw) * Math.cos(pitch) * d); cam.lookAt(c); return { c, size };
  }
  function shoot(it, w, h) {
    const { S, sun } = scene(), grp = model(it); if (!grp) return null; S.add(grp); worker(it, S, sun, grp);
    const cam = new THREE.PerspectiveCamera(32, w / h, 0.1, 200); if (grp.userData.inside) frame(grp, cam, 0.35, 1.0, 1.25); else frame(grp, cam); R.setSize(w, h, false); R.render(S, cam); return R.domElement.toDataURL('image/png');
  }
  const sheet = document.getElementById('sheet');
  for (const [title, items] of GROUPS) {
    const h = document.createElement('h3'); h.textContent = title; sheet.appendChild(h); const grid = document.createElement('div'); grid.className = 'grid'; sheet.appendChild(grid);
    for (const it of items) { const url = shoot(it, 480, 360); const c = document.createElement('div'); c.className = 'card'; c.dataset.id = it[0];
      c.innerHTML = url ? `<img src="${url}" alt=""><div><b>${it[1]}</b><span>${it[5] ? 'Worker: ' + it[5] : '&nbsp;'}</span></div>` : `<div><b>${it[1]}</b><span>not built yet</span></div>`; c.onclick = () => open(it); grid.appendChild(c); }
  }
  /* the big viewer: drag to turn */
  const cv = document.getElementById('view'), VR = new THREE.WebGLRenderer({ canvas: cv, antialias: true }); VR.shadowMap.enabled = true; VR.outputColorSpace = THREE.SRGBColorSpace; VR.setPixelRatio(Math.min(2, devicePixelRatio));
  let cur = null, yaw = 0.75, pitch = 0.55, drag = null;
  function open(it) { const { S, sun } = scene(), grp = model(it); if (!grp) return; S.add(grp); worker(it, S, sun, grp); if (grp.userData.inside) { yaw = 0.35; pitch = 1.0; zoom = 1.25; } cur = { S, grp, cam: new THREE.PerspectiveCamera(32, cv.width / cv.height, 0.1, 200) }; document.getElementById('desc').textContent = it[1] + (it[5] ? ' · ' + it[5] : ''); document.getElementById('viewer').classList.add('on'); }
  document.getElementById('close').onclick = () => { document.getElementById('viewer').classList.remove('on'); cur = null; };
  cv.onpointerdown = (e) => { drag = [e.clientX, e.clientY, yaw, pitch]; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = (e) => { if (drag) { yaw = drag[2] - (e.clientX - drag[0]) * 0.01; pitch = Math.max(0.08, Math.min(1.4, drag[3] + (e.clientY - drag[1]) * 0.01)); } };
  cv.onpointerup = () => (drag = null);
  cv.onwheel = (e) => { e.preventDefault(); zoom = Math.max(0.4, Math.min(2.5, zoom * (e.deltaY > 0 ? 1.1 : 0.9))); }; let zoom = 1.75;
  (function loop() { if (cur) { frame(cur.grp, cur.cam, yaw, pitch, zoom); VR.render(cur.S, cur.cam); } requestAnimationFrame(loop); })();
  const qs = new URLSearchParams(location.search), q = qs.get('piece'), qIn = qs.has('inside'); if (q) { for (const [, items] of GROUPS) { const it = items.find((x) => x[0] === q && (x[2] === 'inside') === qIn); if (it) { open(it); break; } } }
  window.__setView = (y, p, z) => { yaw = y; pitch = p; zoom = z; };   // for screenshots
  window.__ready = true;
})();
</script>
</body></html>
