<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kinstead · Asset Lab</title>
<script>window.__errs=[];addEventListener('error',e=>__errs.push(e.message));</script>
<style>
*{box-sizing:border-box}body{margin:0;background:#eeece7;color:#302e2b;font:14px system-ui}header{padding:16px 24px;background:#fff;border-bottom:1px solid #ccc;display:flex;align-items:center;gap:20px}h1{font:24px Georgia;margin:0}a{color:#526775}.controls{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px}button,select{background:#fff;border:1px solid #bab6ac;border-radius:5px;padding:8px;color:inherit}button{cursor:pointer}label{display:flex;gap:5px;align-items:center}main{display:grid;grid-template-columns:1fr 1fr;margin:0 24px;gap:12px}.pane{position:relative;background:#d9d8d5;height:calc(100vh - 195px);min-height:350px;overflow:hidden;border:1px solid #bdbab2;border-radius:8px}.pane>span{position:absolute;top:12px;left:16px;z-index:2;background:#ffffffc9;padding:5px 9px;border-radius:4px}.pane img{width:100%;height:100%;object-fit:contain}.pane canvas{display:block;width:100%;height:100%}#overlay{position:absolute;inset:0;pointer-events:none;display:none}footer{padding:12px 24px;font:12px monospace}.swatch{display:inline-block;padding:5px;margin:2px;border:1px solid #888}#palette{position:absolute;bottom:8px;left:8px;right:8px;display:flex;flex-wrap:wrap} @media(max-width:700px){main{margin:0 8px;gap:5px}.controls{padding:8px}.pane{height:65vh}header{padding:12px}}
</style></head><body>
<header><h1>Kinstead / Asset Lab</h1><a href="index.html">← Start menu</a><span>One plot. One model. No distractions.</span></header>
<div class="controls"><select id="asset" aria-label="Asset"></select><button id="orbit">Orbit: off</button><select id="mode" aria-label="Comparison mode"><option value="split">Split</option><option value="overlay">Overlay</option><option value="wipe">Wipe</option></select><label>Wipe / opacity <input id="wipe" type="range" min="0" max="100" value="50"></label><button data-light="studio">Studio</button><button data-light="dusk">Game dusk</button><button data-light="night">Night campfire</button><button data-anim="idle">Idle</button><button data-anim="walk">Walk</button><button data-anim="attack">Attack</button><button id="snapshot">Snapshot compare</button><button id="extract">Extract palette</button><label><input type="checkbox" id="dof">DOF</label><label><input type="checkbox" id="snow" checked>Snow</label><button id="reset">Match camera</button></div>
<main><section class="pane"><span>Grok reference</span><img id="reference" alt="Selected Grok reference"><div id="palette"></div></section><section class="pane" id="viewport"><span>Live 3D · drag to orbit / wheel to zoom</span><img id="overlay" alt="Reference overlay"></section></main><footer id="stats">Preparing renderer…</footer>
